version: 2

models:
  - name: stg_products
    description: "Insurance product catalog."
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_customer_quotes
    description: "Customer premium quotes."
    columns:
      - name: quote_id
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null]

  - name: stg_competitor_quotes
    description: "Competitor premium quotes."
    columns:
      - name: quote_id
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null]

  - name: stg_risk_factors
    description: "Underwriting risk factors by product and customer."
    columns:
      - name: product_id
        tests: [not_null]
      - name: risk_score
        tests: [not_null]

  - name: stg_claims
    description: "Historical claims data."
    columns:
      - name: claim_id
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null]

  - name: stg_historical_premiums
    description: "Historical premium averages by product and year."
    columns:
      - name: product_id
        tests: [not_null]
      - name: premium_year
        tests: [not_null]

  - name: stg_market_benchmarks
    description: "Industry market benchmark rates."
    columns:
      - name: product_id
        tests: [not_null]

  - name: fct_pricing
    description: "Insurance pricing fact table combining quotes, risk, claims, and benchmarks."
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: category
        tests: [not_null]
      - name: avg_quoted_premium
        tests: [not_null]
